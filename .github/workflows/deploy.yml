name: Deploy to Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://aacorcmqfjnfpmwauxwx.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhY29yY21xZmpuZnBtd2F1eHd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4OTU2MzYsImV4cCI6MjA1NDQ3MTYzNn0.Vd3cWw1P_e_NnLSmZc-u4-6Yw9F1-0GjY4b1w8P-Y4A' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://aacorcmqfjnfpmwauxwx.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhY29yY21xZmpuZnBtd2F1eHd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4OTU2MzYsImV4cCI6MjA1NDQ3MTYzNn0.Vd3cWw1P_e_NnLSmZc-u4-6Yw9F1-0GjY4b1w8P-Y4A' }}
        run: npm run build

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_AzWASu0iN7mqpiE2tKaNFjG0
          VERCEL_PROJECT_ID: prj_M74ZKV0poUFHsMLtKcY8ScoycGpN
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN secret is not set yet in GitHub Settings -> Secrets -> Actions."
          fi
